ce">|-- backend/</text><text x="24.00" y="106" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- ai/            Embeddings, RAG engine, insights generator, mystery pipeline</text><text x="24.00" y="132" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- api/           FastAPI app, REST routes, WebSocket bridge</text><text x="24.00" y="158" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- config/        Pydantic settings (env-driven)</text><text x="24.00" y="184" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- crawler/       RSS, web (Playwright), Reddit, Bluesky, Mastodon, HN, GDELT</text><text x="24.00" y="210" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- mystery/       Anomaly detection, LLM reasoning, pattern engine</text><text x="24.00" y="236" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- pipeline/      Kafka producer/consumer, dedup, classify, sentiment, NER, trends</text><text x="24.00" y="262" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- storage/       PostgreSQL, ClickHouse, Neo4j, S3, vector store clients</text><text x="24.00" y="288" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   `-- requirements.txt</text><text x="24.00" y="314" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- frontend/</text><text x="24.00" y="340" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   `-- src/</text><text x="24.00" y="366" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|       |-- app/       7 Next.js pages</text><text x="24.00" y="392" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|       |-- components/ Per-page UI components</text><text x="24.00" y="418" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|       |-- hooks/     useWebSocket, usePolling</text><text x="24.00" y="444" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|       |-- lib/       API client</text><text x="24.00" y="470" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|       `-- types/     TypeScript interfaces</text><text x="24.00" y="496" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- deployment/</text><text x="24.00" y="522" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- docker/        docker-compose.yml (full infrastructure stack)</text><text x="24.00" y="548" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- k8s/           Kubernetes manifests (Namespace, Deployments, HPA)</text><text x="24.00" y="574" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   `-- scripts/       DB init SQL + Neo4j Cypher</text><text x="24.00" y="600" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- .env.example       All config vars with comments</text><text x="24.00" y="626" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- start.sh           One-command local startup</text><text x="24.00" y="652" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">`-- kill.sh            Graceful shutdown</text><g id="vines"><rect x="18" y="0" width="6" height="6" fill="#4a7a3c"/><rect x="24" y="0" width="6" height="6" fill="#2f5229"/><rect x="162" y="0" width="6" height="6" fill="#4a7a3c"/><rect x="288" y="0" width="6" height="6" fill="#4a7a3c"/><rect x="294" y="0" width="6" height="6" fill="#2f5229"/><rect x="324" y="0" width="6" height="6" fill="#2f5229"/><rect x="342" y="0" width="6" height="6" fill="#4a7a3c"/><rect x="354" y="0" width="6" height="6" fill=